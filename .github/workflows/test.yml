name: Jev router tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 plugins/jev-router-codex/scripts/test_route.py
